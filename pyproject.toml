[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-partner-opportunity-engine"
version = "0.1.0"
description = "Evidence-led discovery and review of real China-side opportunities"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
china-partner = "china_partner_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
